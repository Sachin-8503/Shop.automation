<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#174a35">
  <title>Shopkeeper sign in | Naariyal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shopkeeper-login.css">
  <script src="shopkeeper-login.js" defer></script>
</head>
<body>
  <header class="login-topbar">
    <a class="brand" href="/" aria-label="Naariyal customer shop">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span>naariyal<span class="brand-dot">.</span><small>SHOP MANAGEMENT</small></span>
    </a>
    <a class="back-to-shop" href="/">Back to customer shop <span aria-hidden="true">&#8599;</span></a>
  </header>
  <main class="login-main">
    <section class="login-panel" aria-labelledby="loginTitle">
      <p class="eyebrow">STAFF ACCESS</p>
      <h1 id="loginTitle">Shopkeeper sign in</h1>
      <p class="login-description">Enter the shopkeeper password shown in the server terminal.</p>
      <form id="staffLoginForm">
        <label for="staffPassword">Password</label>
        <input id="staffPassword" name="password" type="password" autocomplete="current-password" required autofocus>
        <p class="login-error" id="loginError" role="alert" hidden></p>
        <button id="loginButton" type="submit">Sign in <span aria-hidden="true">&#8594;</span></button>
      </form>
    </section>
  </main>
</body>
</html>
